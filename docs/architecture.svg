<svg viewBox="0 0 980 790" xmlns="http://www.w3.org/2000/svg" role="img" font-family="-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif">
  <title>AI Tutor system architecture</title>
  <desc>Request flow from the React SPA through the Laravel API to the Python AI service, Qdrant, and the LLM providers.</desc>
  <rect x="0" y="0" width="980" height="790" fill="#FFFFFF"/>
  <defs>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748B"/>
    </marker>
    <marker id="arrA" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6366F1"/>
    </marker>
  </defs>

  <rect x="150" y="18" width="680" height="92" rx="14" fill="#EEF2FF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="490" y="44" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">React SPA · :5173</text>
  <g font-size="11.5" fill="#0F172A">
    <rect x="175" y="58" width="200" height="38" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
    <text x="275" y="74" text-anchor="middle" font-weight="700">Student</text>
    <text x="275" y="88" text-anchor="middle" font-size="10" fill="#64748B">chat · mind panel · snap · mic</text>
    <rect x="390" y="58" width="200" height="38" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
    <text x="490" y="74" text-anchor="middle" font-weight="700">Parent</text>
    <text x="490" y="88" text-anchor="middle" font-size="10" fill="#64748B">gap dashboard · credits</text>
    <rect x="605" y="58" width="200" height="38" rx="9" fill="#FFFFFF" stroke="#A5B4FC"/>
    <text x="705" y="74" text-anchor="middle" font-weight="700">Admin</text>
    <text x="705" y="88" text-anchor="middle" font-size="10" fill="#64748B">credits console · analytics</text>
  </g>

  <line x1="490" y1="110" x2="490" y2="148" stroke="#6366F1" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="502" y="134" font-size="10.5" fill="#64748B">JSON + SSE (Sanctum)</text>
  <circle cx="455" cy="129" r="9" fill="#6366F1"/><text x="455" y="132.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1</text>

  <rect x="80" y="150" width="820" height="150" rx="14" fill="#FFFFFF" stroke="#6366F1" stroke-width="1.5"/>
  <text x="490" y="174" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Laravel 11 API · :8000 · system of record</text>
  <g font-size="11.5" fill="#0F172A">
    <rect x="100" y="190" width="150" height="48" rx="9" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="175" y="210" text-anchor="middle" font-weight="700">TokenGate</text>
    <text x="175" y="226" text-anchor="middle" font-size="10" fill="#64748B">quota check → 402</text>
    <rect x="290" y="190" width="160" height="48" rx="9" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="370" y="210" text-anchor="middle" font-weight="700">TutorService</text>
    <text x="370" y="226" text-anchor="middle" font-size="10" fill="#64748B">prompts · AI funnel</text>
    <rect x="490" y="190" width="160" height="48" rx="9" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="570" y="210" text-anchor="middle" font-weight="700">MindService</text>
    <text x="570" y="226" text-anchor="middle" font-size="10" fill="#64748B">memory · mastery</text>
    <rect x="690" y="190" width="190" height="48" rx="9" fill="#EEF2FF" stroke="#6366F1"/>
    <text x="785" y="210" text-anchor="middle" font-weight="700">TokenMeter</text>
    <text x="785" y="226" text-anchor="middle" font-size="10" fill="#64748B">ledger: tokens · ₹</text>
  </g>
  <line x1="250" y1="214" x2="288" y2="214" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrA)"/>
  <circle cx="269" cy="201" r="9" fill="#6366F1"/><text x="269" y="204.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
  <line x1="450" y1="214" x2="488" y2="214" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrA)"/>
  <circle cx="469" cy="201" r="9" fill="#6366F1"/><text x="469" y="204.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">6</text>
  <line x1="650" y1="214" x2="688" y2="214" stroke="#6366F1" stroke-width="1.8" marker-end="url(#arrA)"/>
  <text x="490" y="276" text-anchor="middle" font-size="10.5" fill="#64748B">per chat turn: gate → prompt (+ memory · weakest concepts · misconceptions) → AI → meter → mind event</text>

  <line x1="170" y1="300" x2="170" y2="352" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="330" y1="300" x2="330" y2="352" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <line x1="650" y1="300" x2="650" y2="352" stroke="#6366F1" stroke-width="2" marker-end="url(#arrA)"/>
  <text x="662" y="330" font-size="10.5" fill="#64748B">internal REST (bearer)</text>
  <circle cx="627" cy="326" r="9" fill="#6366F1"/><text x="627" y="329.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">3</text>

  <rect x="95" y="354" width="150" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="170" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">PostgreSQL</text>
  <text x="170" y="398" text-anchor="middle" font-size="10" fill="#64748B">system of record</text>
  <rect x="265" y="354" width="130" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="330" y="381" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Redis</text>
  <text x="330" y="398" text-anchor="middle" font-size="10" fill="#64748B">cache · queue</text>

  <rect x="430" y="354" width="470" height="180" rx="14" fill="#FFFBEB" stroke="#F59E0B" stroke-width="1.5"/>
  <text x="665" y="380" text-anchor="middle" font-size="15" font-weight="700" fill="#0F172A">Python AI service · :8001 · all LLM work</text>
  <g font-size="11" fill="#0F172A">
    <rect x="450" y="396" width="210" height="44" rx="9" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="555" y="414" text-anchor="middle" font-weight="700">/ai/text · /ai/json · /ai/stream</text>
    <text x="555" y="430" text-anchor="middle" font-size="10" fill="#64748B">generic, RAG-aware</text>
    <rect x="680" y="396" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="780" y="414" text-anchor="middle" font-weight="700">Model router</text>
    <text x="780" y="430" text-anchor="middle" font-size="10" fill="#64748B">chat | structured | grade</text>
    <rect x="450" y="456" width="210" height="44" rx="9" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="555" y="474" text-anchor="middle" font-weight="700">RAG retrieve + embed</text>
    <text x="555" y="490" text-anchor="middle" font-size="10" fill="#64748B">local fastembed · 384-dim</text>
    <rect x="680" y="456" width="200" height="44" rx="9" fill="#FFFFFF" stroke="#FCD34D"/>
    <text x="780" y="474" text-anchor="middle" font-weight="700">/ai/ocr</text>
    <text x="780" y="490" text-anchor="middle" font-size="10" fill="#64748B">tesseract · snap-a-doubt</text>
  </g>
  <text x="665" y="522" text-anchor="middle" font-size="10.5" fill="#64748B">AI_MOCK=true → deterministic offline mode · usage (tokens + model) on every response</text>

  <line x1="555" y1="534" x2="555" y2="586" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
  <circle cx="533" cy="560" r="9" fill="#6366F1"/><text x="533" y="563.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">4</text>
  <line x1="780" y1="534" x2="780" y2="586" stroke="#6366F1" stroke-width="2" marker-end="url(#arrA)"/>
  <circle cx="757" cy="560" r="9" fill="#6366F1"/><text x="757" y="563.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">5</text>

  <rect x="430" y="588" width="250" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="555" y="615" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">Qdrant</text>
  <text x="555" y="632" text-anchor="middle" font-size="10" fill="#64748B">curriculum embeddings, topic-filtered</text>
  <rect x="700" y="588" width="200" height="64" rx="12" fill="#FFFFFF" stroke="#CBD5E1" stroke-width="1.5"/>
  <text x="800" y="610" text-anchor="middle" font-size="13" font-weight="700" fill="#0F172A">LLM providers</text>
  <text x="800" y="626" text-anchor="middle" font-size="10" fill="#64748B">Gemini · OpenAI · Anthropic</text>
  <text x="800" y="640" text-anchor="middle" font-size="10" fill="#64748B">or OpenRouter gateway</text>

  <g font-size="11" fill="#0F172A">
    <text x="80" y="688" font-weight="700" fill="#64748B" font-size="10.5">ONE CHAT TURN</text>
    <circle cx="89" cy="706" r="9" fill="#6366F1"/><text x="89" y="709.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">1</text>
    <text x="104" y="710">student sends message</text>
    <circle cx="89" cy="728" r="9" fill="#6366F1"/><text x="89" y="731.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">2</text>
    <text x="104" y="732">quota gate, then prompt + mind context</text>
    <circle cx="89" cy="750" r="9" fill="#6366F1"/><text x="89" y="753.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">3</text>
    <text x="104" y="754">Laravel calls the AI service</text>
    <circle cx="389" cy="706" r="9" fill="#6366F1"/><text x="389" y="709.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">4</text>
    <text x="404" y="710">retrieve curriculum (RAG)</text>
    <circle cx="389" cy="728" r="9" fill="#6366F1"/><text x="389" y="731.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">5</text>
    <text x="404" y="732">routed model streams the reply (SSE)</text>
    <circle cx="389" cy="750" r="9" fill="#6366F1"/><text x="389" y="753.5" text-anchor="middle" font-size="10" font-weight="700" fill="#FFFFFF">6</text>
    <text x="404" y="754">meter tokens → ledger · extract signals → mind</text>
  </g>
  <g font-size="10.5" fill="#64748B">
    <line x1="720" y1="706" x2="756" y2="706" stroke="#6366F1" stroke-width="2" marker-end="url(#arrA)"/>
    <text x="764" y="710">request / AI path</text>
    <line x1="720" y1="730" x2="756" y2="730" stroke="#64748B" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arr)"/>
    <text x="764" y="734">data reads / writes</text>
  </g>
</svg>
