# Serves the built SPA and proxies /api to the Laravel backend — the same
# routing the Vite dev server did via server.proxy, but for the built bundle.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build assets are immutable — cache them hard.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API → backend (Docker service name; change if your backend is elsewhere).
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming (chat SSE) — don't buffer.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # SPA fallback: every non-file route serves index.html so client routing works.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
