# Full stack: Laravel API + Python AI service + Postgres + Redis + Qdrant + Neo4j + React.
# Usage:
#   1) cp .env.example .env   (paste your Gemini key, or leave AI_MOCK=true)
#   2) docker compose up --build
#   3) open http://localhost:5173
#
# Architecture: Laravel owns data + orchestration and calls the Python AI
# service (which owns all LLM/RAG/graph work) over internal REST. Postgres is the
# system of record; Redis backs cache/queue + token counters; Qdrant stores all
# embeddings (curriculum, documents, events); Neo4j stores the knowledge graph
# that powers the GraphRAG "AI mind" (no vectors — it references Qdrant points).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aitutor
      POSTGRES_USER: aitutor
      POSTGRES_PASSWORD: ${DB_PASSWORD:-aitutor}
    ports:
      - "5432:5432"
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aitutor"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

  # Neo4j is the knowledge-graph / reasoning layer for the GraphRAG "AI mind":
  # curriculum backbone, concepts + prerequisites, per-student mastery,
  # misconceptions, focus, and an event node per user action. It stores NO
  # embeddings — vectors live in Qdrant; graph nodes reference Qdrant point ids.
  neo4j:
    image: neo4j:5.24-community
    environment:
      NEO4J_AUTH: neo4j/${NEO4J_PASSWORD:-tutopass}
      NEO4J_PLUGINS: '["apoc"]'
      NEO4J_server_memory_heap_max__size: 1G
    ports:
      - "7474:7474"   # Neo4j Browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data
    healthcheck:
      test: ["CMD-SHELL", "cypher-shell -u neo4j -p ${NEO4J_PASSWORD:-tutopass} 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 15
      # Neo4j takes ~30-45s to open its Bolt listener; don't count early
      # failures (avoids the ai-service connection-refused storm on first boot).
      start_period: 45s

  ai-service:
    build: ./ai-service
    ports:
      - "8001:8001"
    environment:
      # Multi-provider: set AI_PROVIDER (gemini|google|openai|anthropic|auto) and
      # the matching key. "auto" picks the first provider with a key set.
      # OPENAI_BASE_URL also enables OpenAI-compatible gateways (OpenRouter).
      # AI_PROVIDER=google → Gemini via the google-genai SDK (text + vision),
      # using GEMINI_API_KEY/GOOGLE_API_KEY, or ADC, or Vertex AI.
      AI_PROVIDER: ${AI_PROVIDER:-auto}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com/v1}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # Google Gen AI SDK (AI_PROVIDER=google). Simplest: set GEMINI_API_KEY above.
      # For ADC/Vertex instead, set these + uncomment the gcloud volume below.
      # Fall back to GEMINI_API_KEY: the google-genai SDK's Client() auto-detects
      # GOOGLE_API_KEY from the env, so mirror the key here when only GEMINI_API_KEY
      # is set (otherwise the SDK reports "Missing key inputs argument").
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-${GEMINI_API_KEY:-}}
      GOOGLE_GENAI_USE_VERTEXAI: ${GOOGLE_GENAI_USE_VERTEXAI:-false}
      GOOGLE_CLOUD_PROJECT: ${GOOGLE_CLOUD_PROJECT:-}
      GOOGLE_CLOUD_LOCATION: ${GOOGLE_CLOUD_LOCATION:-}
      GOOGLE_APPLICATION_CREDENTIALS: ${GOOGLE_APPLICATION_CREDENTIALS:-}
      # Gemini model used to read images when AI_PROVIDER=google.
      GEMINI_VISION_MODEL: ${GEMINI_VISION_MODEL:-gemini-2.5-flash}
      AI_MOCK: ${AI_MOCK:-false}
      # Model routing: AI_MODEL = single-model switch (overrides the three
      # per-action routes below). Leave all empty for provider defaults.
      AI_MODEL: ${AI_MODEL:-}
      AI_MODEL_CHAT: ${AI_MODEL_CHAT:-}
      AI_MODEL_STRUCTURED: ${AI_MODEL_STRUCTURED:-}
      AI_MODEL_GRADE: ${AI_MODEL_GRADE:-}
      # Vision model for reading uploaded diagrams / handwriting (OpenRouter,
      # OpenAI-compatible). Falls back to local tesseract OCR when no key.
      AI_MODEL_VISION: ${AI_MODEL_VISION:-nvidia/nemotron-nano-12b-v2-vl:free}
      # Free OpenRouter models can be slow and 429-retry; give them headroom.
      LLM_TIMEOUT: ${LLM_TIMEOUT:-120}
      QDRANT_URL: http://qdrant:6333
      QDRANT_COLLECTION: curriculum
      # Two more Qdrant collections back the GraphRAG flow: uploaded study-note
      # chunks, and an embedding per tracked user action (for semantic recall).
      QDRANT_DOC_COLLECTION: ${QDRANT_DOC_COLLECTION:-documents}
      QDRANT_EVENT_COLLECTION: ${QDRANT_EVENT_COLLECTION:-events}
      # Neo4j knowledge graph (graph + reasoning; no vectors).
      NEO4J_URI: ${NEO4J_URI:-bolt://neo4j:7687}
      NEO4J_USER: ${NEO4J_USER:-neo4j}
      NEO4J_PASSWORD: ${NEO4J_PASSWORD:-tutopass}
      # Embeddings: "auto" prefers local fastembed (free, no API key, no 404s).
      # Override with gemini/openai/mock if desired.
      EMBED_BACKEND: ${EMBED_BACKEND:-auto}
      # Cache the fastembed model between restarts (downloaded once on first use).
      FASTEMBED_CACHE_PATH: /models
      # Shared upload volume (textbook ingest): MUST equal the path Laravel
      # mounts its storage/app at, so this service reads uploaded PDFs in place
      # (no 200 MB HTTP transfer) and writes rendered page images where Laravel
      # can serve them.
      UPLOAD_ROOT: /app/storage/app
      INTERNAL_API_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
    volumes:
      - fastembed_cache:/models
      # Same named volume the backend uses, mounted at the same path (UPLOAD_ROOT).
      - app_storage:/app/storage/app
      # ── Gemini via ADC / Vertex AI (uses the GCP $300 credit, not an API key) ──
      # Mounts the host gcloud creds so the google-genai SDK can use ADC; pair
      # with GOOGLE_GENAI_USE_VERTEXAI=true + GOOGLE_CLOUD_PROJECT/LOCATION in .env.
      - ${HOME}/.config/gcloud:/root/.config/gcloud:ro
    # Wait for Neo4j to be HEALTHY (Bolt accepting connections) before starting,
    # so schema init + the first graph:sync don't race a half-booted Neo4j.
    depends_on:
      qdrant:
        condition: service_started
      neo4j:
        condition: service_healthy

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: aitutor
      DB_USERNAME: aitutor
      DB_PASSWORD: ${DB_PASSWORD:-aitutor}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      FRONTEND_URL: http://localhost:5173
      # AI now comes from the Python service, not Gemini directly.
      AI_SERVICE_URL: http://ai-service:8001
      AI_SERVICE_KEY: ${INTERNAL_API_KEY:-dev-internal-key}
      # Must exceed the AI service's LLM_TIMEOUT + retries, or Laravel gives up
      # while the model is still generating ("Couldn't generate a quiz").
      AI_SERVICE_TIMEOUT: ${AI_SERVICE_TIMEOUT:-180}
      # Set DB_FRESH=true (once) to wipe + reseed explicitly; otherwise the
      # database is created + seeded only on first boot and then preserved.
      DB_FRESH: ${DB_FRESH:-false}
    # Persist uploaded study notes (storage/app) across image rebuilds.
    volumes:
      - app_storage:/app/storage/app
    depends_on:
      postgres:
        condition: service_healthy
      ai-service:
        condition: service_started
      redis:
        condition: service_started

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    environment:
      VITE_PROXY_TARGET: http://backend:8000
    # Bind-mount the source so Vite hot-reloads edits without a rebuild.
    # The anonymous volume keeps the image's node_modules (not the host's).
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pg_data:
  qdrant_data:
  neo4j_data:
  fastembed_cache:
  app_storage:
